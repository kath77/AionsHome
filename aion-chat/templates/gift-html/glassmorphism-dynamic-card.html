<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>精致动态卡片</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(circle at 15% 20%, #ffb4d8, transparent 28%),
    radial-gradient(circle at 80% 10%, #9bdcff, transparent 26%),
    radial-gradient(circle at 70% 80%, #ffe49b, transparent 30%),
    #eef6ff;
  overflow: hidden;
}

.card {
  position: relative;
  width: 360px;
  padding: 30px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.48);
  border: 1px solid rgba(255, 255, 255, 0.75);
  box-shadow:
    0 30px 80px rgba(82, 113, 255, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(18px);
  overflow: hidden;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.card:hover {
  transform: translateY(-12px) scale(1.02);
  box-shadow:
    0 40px 100px rgba(82, 113, 255, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.card::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  background: linear-gradient(135deg, #ff7eb3, #8ec5ff);
  border-radius: 50%;
  top: -80px;
  right: -70px;
  opacity: 0.6;
}

.card::after {
  content: "";
  position: absolute;
  width: 120px;
  height: 120px;
  background: linear-gradient(135deg, #fff3a3, #ff9ec7);
  border-radius: 50%;
  bottom: -60px;
  left: -45px;
  opacity: 0.6;
}

.badge {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.62);
  color: #ff5c93;
  font-weight: 700;
  font-size: 13px;
}

.illustration {
  position: relative;
  z-index: 2;
  height: 150px;
  display: grid;
  place-items: center;
}

.bear {
  width: 108px;
  height: 96px;
  background: #fff3dc;
  border-radius: 48% 48% 42% 42%;
  position: relative;
  box-shadow: inset 0 -8px 0 rgba(255, 195, 130, 0.22);
  animation: bounce 2.4s ease-in-out infinite;
}

.bear::before,
.bear::after {
  content: "";
  position: absolute;
  width: 34px;
  height: 34px;
  background: #fff3dc;
  border-radius: 50%;
  top: -12px;
}

.bear::before {
  left: 6px;
}

.bear::after {
  right: 6px;
}

.face {
  position: absolute;
  left: 50%;
  top: 40px;
  transform: translateX(-50%);
  width: 70px;
  height: 38px;
}

.eye {
  position: absolute;
  top: 2px;
  width: 8px;
  height: 12px;
  background: #5d4037;
  border-radius: 50%;
}

.eye.left {
  left: 14px;
}

.eye.right {
  right: 14px;
}

.nose {
  position: absolute;
  top: 18px;
  left: 50%;
  width: 12px;
  height: 9px;
  transform: translateX(-50%);
  background: #5d4037;
  border-radius: 50%;
}

.blush {
  position: absolute;
  top: 22px;
  width: 14px;
  height: 8px;
  background: #ff9eb8;
  border-radius: 50%;
  opacity: 0.8;
}

.blush.left {
  left: 0;
}

.blush.right {
  right: 0;
}

.content {
  position: relative;
  z-index: 2;
  text-align: center;
}

.content h1 {
  margin: 0 0 10px;
  color: #2f3a5f;
  font-size: 28px;
}

.content p {
  margin: 0;
  color: #6b7280;
  line-height: 1.8;
  font-size: 15px;
}

.button {
  position: relative;
  z-index: 2;
  margin: 24px auto 0;
  width: 170px;
  height: 46px;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff7eb3, #7aa7ff);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 800;
  box-shadow: 0 12px 24px rgba(255, 126, 179, 0.35);
  cursor: pointer;
  transition: transform 0.25s ease;
}

.button:hover {
  transform: scale(1.06);
}

.sparkle {
  position: absolute;
  color: white;
  font-size: 22px;
  animation: sparkle 2s linear infinite;
}

.sparkle.s1 {
  top: 35px;
  left: 36px;
}

.sparkle.s2 {
  right: 45px;
  top: 145px;
  animation-delay: 0.6s;
}

.sparkle.s3 {
  bottom: 70px;
  left: 60px;
  animation-delay: 1.1s;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0) rotate(-2deg);
  }
  50% {
    transform: translateY(-12px) rotate(2deg);
  }
}

@keyframes sparkle {
  0%, 100% {
    opacity: 0.2;
    transform: scale(0.8) rotate(0deg);
  }
  50% {
    opacity: 1;
    transform: scale(1.2) rotate(25deg);
  }
}
</style>
</head>
<body>
  <div class="card">
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>

    <div class="badge">🌸 Cute Card</div>

    <div class="illustration">
      <div class="bear">
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
        </div>
      </div>
    </div>

    <div class="content">
      <h1>今日小惊喜</h1>
      <p>
        这是一张可爱的动态玻璃卡片，<br />
        适合做活动弹窗、祝福卡、会员卡片。
      </p>
    </div>

    <div class="button">立即查看</div>
  </div>
</body>
</html>
