<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>可爱信件</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 20% 20%, #ffe5f0 0 12%, transparent 13%),
    radial-gradient(circle at 80% 10%, #fff0b8 0 10%, transparent 11%),
    linear-gradient(135deg, #ffd6e8, #dbeafe);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
}

.scene {
  text-align: center;
}

.title {
  color: #ff5c93;
  font-size: 28px;
  margin-bottom: 40px;
  letter-spacing: 2px;
}

.envelope {
  position: relative;
  width: 320px;
  height: 210px;
  cursor: pointer;
  margin: 0 auto;
  filter: drop-shadow(0 20px 30px rgba(255, 98, 143, 0.25));
}

.back {
  position: absolute;
  inset: 0;
  background: #ff8fb3;
  border-radius: 12px;
}

.front {
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, #ff77a8, #ff9ec1);
  clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  border-radius: 12px;
  z-index: 4;
}

.left,
.right {
  position: absolute;
  bottom: 0;
  width: 50%;
  height: 100%;
  background: #ff6f9f;
  z-index: 3;
}

.left {
  left: 0;
  clip-path: polygon(0 0, 100% 50%, 0 100%);
  border-radius: 12px 0 0 12px;
}

.right {
  right: 0;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
  border-radius: 0 12px 12px 0;
}

.flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 320px;
  height: 150px;
  background: #ff9fbd;
  clip-path: polygon(0 0, 50% 100%, 100% 0);
  transform-origin: top;
  transition: transform 0.7s ease;
  z-index: 6;
  border-radius: 12px 12px 0 0;
}

.letter {
  position: absolute;
  left: 24px;
  bottom: 18px;
  width: 272px;
  height: 180px;
  background: #fff;
  border-radius: 16px;
  padding: 26px 22px;
  z-index: 2;
  transition: transform 0.8s ease 0.2s;
  box-shadow: 0 12px 25px rgba(255, 115, 160, 0.22);
}

.letter h2 {
  margin: 0 0 12px;
  color: #ff5c93;
  font-size: 22px;
}

.letter p {
  margin: 0;
  color: #666;
  font-size: 15px;
  line-height: 1.8;
}

.heart {
  position: absolute;
  color: #ff4f8b;
  font-size: 24px;
  opacity: 0;
  pointer-events: none;
}

.envelope.open .flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.envelope.open .letter {
  transform: translateY(-145px);
  z-index: 5;
}

.envelope.open .heart {
  animation: floatUp 1.8s ease forwards;
}

.heart:nth-child(6) {
  left: 20px;
  top: 80px;
  animation-delay: 0.1s;
}

.heart:nth-child(7) {
  left: 135px;
  top: 40px;
  animation-delay: 0.25s;
}

.heart:nth-child(8) {
  right: 30px;
  top: 75px;
  animation-delay: 0.4s;
}

.tip {
  margin-top: 36px;
  color: #ff6b9a;
  font-weight: 600;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(0.7);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    transform: translateY(-160px) scale(1.4) rotate(20deg);
    opacity: 0;
  }
}
</style>
</head>
<body>
  <div class="scene">
    <div class="title">你有一封可爱的信件 💌</div>

    <div class="envelope" onclick="this.classList.toggle('open')">
      <div class="back"></div>
      <div class="letter">
        <h2>亲爱的你：</h2>
        <p>
          愿你今天也被温柔包围。<br />
          这是一封藏着小惊喜的信。<br />
          点击信封可以打开或收起哦。
        </p>
      </div>
      <div class="flap"></div>
      <div class="left"></div>
      <div class="right"></div>
      <div class="front"></div>
      <div class="heart">❤</div>
      <div class="heart">❤</div>
      <div class="heart">❤</div>
    </div>

    <div class="tip">点击信封查看内容</div>
  </div>
</body>
</html>
